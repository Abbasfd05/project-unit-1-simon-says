<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Simon Says Game</title>
    
    <link rel="stylesheet" href="./css/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <script defer src="./js/app.js"></script> 
   <audio id="clip1">

  </audio>
  <audio id="clip2">

<body>
  <h1>
  <span class="word1">Simon</span>
  <span class="word2">Says</span>
  <span class="word3">Game</span>
 </h1>
    <div id="outerCircle">
      <div id="topLeft"></div>
      <div id="topRight"></div>
      <div id="bottomLeft"></div>
      <div id="bottomRight"></div>
      <div id="innerCircle">
        <div id="switchesOptions">
          <input type="checkbox" name="switches" id="on">
          <label for="on" class="My2ndText">Power</label>
          <input type="checkbox" name="switches" id="strict">
          <label for="strict" class="My2ndText9">STRICT</label>
  
        </div>
        <div id="start" class="My1stText">Start</div>
        <div class="My2ndText">Count: <span id="turn"></span></div>
      </div>
    </div>
</body>
